<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Mock checkout — no payment</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;padding:24px;background:#050505;color:#fff;font:16px/1.65 system-ui,sans-serif;display:grid;place-items:center}
    main{width:min(100%,480px);padding:32px;border:1px solid #5f3aaf;border-radius:24px;background:linear-gradient(150deg,#230761,#050505 75%)}
    img{width:80px;height:80px;object-fit:contain;border-radius:18px;background:white}
    .label{margin-top:24px;font-size:12px;letter-spacing:.1em;font-weight:700}
    h1{font-size:30px;line-height:1.2}p{color:#ddd}dl div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ffffff26}dd{margin:0;font-weight:700}
    a{display:block;margin-top:24px;padding:14px;background:#3A0CA3;border-radius:40px;color:#fff;text-align:center;text-decoration:none;font-weight:600}
    a:focus-visible{outline:2px solid white;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <img src="assets/miner-logo.png" alt="Crypto Facility">
    <div class="label">UI TRAINING DEMO — NOT OXAPAY</div>
    <h1>Mock checkout</h1>
    <p>This local screen demonstrates a checkout redirect. No invoice was created, no email was sent and no payment is possible.</p>
    <dl><div><dt>Example plan</dt><dd id="plan">—</dd></div><div><dt>Example amount</dt><dd id="amount">—</dd></div></dl>
    <a href="index.html#plan">Return to the UI demo</a>
  </main>
  <script>
    const values=new URLSearchParams(location.search);
    document.getElementById('plan').textContent=(values.get('plan')||'Not selected').slice(0,40);
    document.getElementById('amount').textContent=(values.get('amount')||'Not selected').slice(0,30);
  </script>
</body>
</html>
